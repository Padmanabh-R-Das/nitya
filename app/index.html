var addDays = function(s,n){ var d=dt(s); d.setDate(d.getDate()+n); return iso(d); };
var gap = function(a,b){ return Math.round((dt(b)-dt(a))/864e5); };
var dow = function(s){ return dt(s).getDay(); };
var fmt = function(s){ return dt(s).toLocaleDateString(undefined,{day:"numeric",month:"short"}); };
var fmtLong = function(s){ return dt(s).toLocaleDateString(undefined,{weekday:"short",day:"numeric",month:"short"}); };
var monOf = function(s){ return addDays(s, -((dow(s)+6)%7)); };
var hm = function(t){ var p=String(t||"0:0").split(":"); return (+p[0])*60+(+p[1]||0); };
var clock = function(m){ m=Math.round(m); var hh=Math.floor(m/60)%24, mm=m%60, ap=hh<12?"am":"pm", h12=hh%12||12; return h12+(mm?":"+String(mm).padStart(2,"0"):"")+" "+ap; };

/* ── Contests: live calendar + the assigner ─────────────────────────────────────────────────
   A free job collects upcoming contests every 6 hours into data/contests.json (Codeforces, LeetCode, CodeChef,
   AtCoder, HackerRank). The assigner books the right ones into your week, on the platforms you use:
   - a rating only moves in rated contests, so rated rounds come first, on your main arena first;
   - LeetCode contests start once you've solved ~100 problems (before that they mostly measure reading speed);
   - Codeforces divisions follow your rating (Div 4/3/Educational/Div 2 below 1400; no Div 1);
   - only in free time: not in class, after wake+1h, ending before sleep, never two on one day;
   - how many a week follows your real pace: 1 by default, 2 with 3h+ days or a CP goal, 1 if last week was under
     60%, none in an exam week, +1 on a stretch-floor week (max 3);
   - every contest brings a 40-minute upsolve block the next day (one problem you didn't solve, from a blank file).
   It recomputes every time you open the app, so the plan follows your progress. Skip or add any round yourself.  */
